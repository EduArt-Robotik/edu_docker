version: "3.0"

services:
    triton_sensor_driver:
        image: eduartrobotik/sensor:1.1.0
        container_name: eduart-sensor-triton-1.1.0
        user: root
        restart: always
        privileged: true
        ipc: host
        pid: host
        mem_limit: 300mb
        environment:
            - EDU_ROBOT_NAMESPACE=${EDU_ROBOT_NAMESPACE}
            - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
            - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
        network_mode: "host"
        devices:
            - '/dev:/dev'
        command: bash -c 'cd /home/user/ros/launch_content; ros2 launch triton_launch.py triton_ip:=192.168.0.71'
        volumes:
            - './launch_content:/home/user/ros/launch_content:r'
